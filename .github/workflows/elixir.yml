name: Elixir
on:
  # Pushes to branches with an open PR are covered by the pull_request
  # trigger; filtering here keeps the matrix from running twice.
  push:
    branches: [master]
  pull_request:

# The repository default is read-write; this workflow only reads code.
permissions:
  contents: read

env:
  MIX_ENV: test

# Version support policy:
#   * Elixir: the branches still receiving security patches
#     https://hexdocs.pm/elixir/compatibility-and-deprecations.html
#   * Erlang/OTP: the three most recent majors, which is what the OTP team maintains
# Elixir 1.16 and older are excluded because they cannot run on a maintained OTP.
jobs:
  test:
    runs-on: ubuntu-latest
    name: Elixir ${{matrix.elixir}} / OTP ${{matrix.otp}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17.x"
            otp: "27.x"
          - elixir: "1.18.x"
            otp: "27.x"
          - elixir: "1.19.x"
            otp: "28.x"
          - elixir: "1.20.x"
            otp: "29.x"
            lint: true
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ex_audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The mix steps below execute dependency code; don't leave a
          # usable token behind in .git/config for them.
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      # Keyed on the resolved versions: _build artifacts are not portable
      # between Elixir/OTP releases.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{runner.os}}-mix-${{steps.beam.outputs.elixir-version}}-${{steps.beam.outputs.otp-version}}-${{hashFiles('**/mix.lock')}}
          restore-keys: |
            ${{runner.os}}-mix-${{steps.beam.outputs.elixir-version}}-${{steps.beam.outputs.otp-version}}-

      - run: mix deps.get

      - run: mix deps.unlock --check-unused
        if: matrix.lint

      - run: mix format --check-formatted
        if: matrix.lint

      - run: mix compile --warnings-as-errors
        if: matrix.lint

      - run: mix compile
        if: ${{ !matrix.lint }}

      - run: mix test
